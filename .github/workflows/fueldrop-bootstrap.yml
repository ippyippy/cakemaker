name: Bootstrap FuelDrop source

on:
  push:
    paths:
      - .github/workflows/fueldrop-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build isolated FuelDrop source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fueldrop
          curl -fsSL 'https://psytztnkeeymavzmpomv.supabase.co/functions/v1/fueldrop?asset=standalone' -o fueldrop/index.html

          grep -q 'const BACKEND="https://psytztnkeeymavzmpomv.supabase.co/functions/v1/fueldrop"' fueldrop/index.html
          grep -q 'navigator.serviceWorker.register("/sw.js",{scope:"/"})' fueldrop/index.html
          grep -q '/manifest.webmanifest' fueldrop/index.html

          cat > fueldrop/manifest.webmanifest <<'EOF'
          {
            "name": "FuelDrop",
            "short_name": "FuelDrop",
            "id": "/",
            "start_url": "/",
            "scope": "/",
            "display": "standalone",
            "background_color": "#07111f",
            "theme_color": "#07111f",
            "description": "Find the best-value fuel stop near you.",
            "icons": [
              {"src":"/icon.svg","sizes":"any","type":"image/svg+xml","purpose":"any maskable"}
            ]
          }
          EOF

          cat > fueldrop/icon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <rect width="512" height="512" rx="96" fill="#0d1410"/>
          <path fill="#83e83d" d="M256 58c-24 43-108 141-108 236 0 68 48 122 108 122s108-54 108-122C364 199 280 101 256 58Z"/>
          <path fill="#0d1410" d="M256 155c-15 26-57 79-57 128 0 36 25 65 57 65s57-29 57-65c0-49-42-102-57-128Z"/>
          <circle cx="256" cy="286" r="22" fill="#83e83d"/>
          </svg>
          EOF

          cat > fueldrop/sw.js <<'EOF'
          const C='fueldrop-web-v57';
          const HOME='/';
          const SHELL=[HOME,'/manifest.webmanifest','/icon.svg'];
          self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(SHELL)).then(()=>self.skipWaiting()))});
          self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==C).map(x=>caches.delete(x)))).then(()=>self.clients.claim()))});
          self.addEventListener('push',e=>{let d={};try{d=e.data?e.data.json():{}}catch{d={body:e.data?e.data.text():'Fuel prices updated'}};const title=d.title||'FuelDrop';const o={body:d.body||'Your best-value fuel update is ready.',icon:'/icon.svg',badge:'/icon.svg',tag:d.tag||'fueldrop',renotify:true,data:d.data||{},actions:[{action:'open',title:'Open FuelDrop'}]};e.waitUntil(self.registration.showNotification(title,o))});
          self.addEventListener('notificationclick',e=>{e.notification.close();e.waitUntil(clients.matchAll({type:'window',includeUncontrolled:true}).then(cs=>{for(const c of cs){if('focus' in c&&new URL(c.url).origin===self.location.origin)return c.focus()}return clients.openWindow(HOME)}))});
          self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;const u=new URL(e.request.url);if(u.origin!==self.location.origin)return;e.respondWith(fetch(e.request).then(r=>{if(r.ok)caches.open(C).then(c=>c.put(e.request,r.clone()));return r}).catch(()=>caches.match(e.request).then(r=>r||caches.match(HOME))))});
          EOF

          cat > fueldrop/vercel.json <<'EOF'
          {
            "cleanUrls": true,
            "trailingSlash": false,
            "headers": [
              {"source":"/sw.js","headers":[{"key":"Cache-Control","value":"public, max-age=0, must-revalidate"},{"key":"Service-Worker-Allowed","value":"/"}]},
              {"source":"/manifest.webmanifest","headers":[{"key":"Content-Type","value":"application/manifest+json"}]},
              {"source":"/(.*)","headers":[{"key":"X-Content-Type-Options","value":"nosniff"},{"key":"Referrer-Policy","value":"strict-origin-when-cross-origin"},{"key":"Permissions-Policy","value":"geolocation=(self)"}]}
            ]
          }
          EOF

      - name: Commit FuelDrop folder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fueldrop
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add FuelDrop v57 standalone source'
          git push
