name: FillMeNow shared destination and Search GPS QA
on:
  push:
    branches: [fix/shared-destination-precise-search-20261009]
    paths: ['web/**', 'tools/shared-search-*', '.github/workflows/shared-search-qa.yml']
permissions:
  contents: read
concurrency:
  group: fmn-shared-destination-20261009
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply reviewed changes to existing source
        run: |
          python3 tools/shared-search-apply.py
          python3 tools/shared-search-finish.py
          node --check web/nearby-ui.js
          node --check web/journey.js
          node --check web/live-location.js
          node --check web/gps-permission.js
          git diff --check
      - name: Install isolated pinned browser test tools
        run: |
          npm install --prefix /tmp/fmn-qa --ignore-scripts --no-audit --no-fund playwright@1.58.2
          /tmp/fmn-qa/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify shared filters, GPS and existing features
        env:
          NODE_PATH: /tmp/fmn-qa/node_modules
        run: |
          node tools/shared-search-test.cjs
          node tools/nearby-test.cjs
          node tools/saved-stations-test.cjs
          node tools/dash-position-test.cjs
          node tools/exact-map-test.cjs
          node tools/support-release-test.cjs
          node tools/backend-route-test.cjs
          git diff --check
      - name: Commit only passing source to this candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/fix/shared-destination-precise-search-20261009
          git add web/index.html web/journey.js web/nearby-ui.js web/journey.css web/live-location.js web/sw.js web/data/station-information.json tools/shared-search-test.cjs
          if ! git diff --cached --quiet; then
            git -c user.name='FillMeNow QA' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Apply verified shared destination filters and precise Search GPS'
            git -c credential.helper='!gh auth git-credential' push origin HEAD:refs/heads/fix/shared-destination-precise-search-20261009
          fi
          mkdir -p qa-results/shared-search
          git rev-parse HEAD > qa-results/shared-search/review-commit.txt
      - name: Preserve public-source verification evidence
        if: always()
        run: |
          mkdir -p qa-results/shared-search
          cp -r web qa-results/shared-search/reviewed-web
          cp tools/shared-search-* qa-results/shared-search/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fillmenow-shared-search-evidence
          path: qa-results/
          retention-days: 7
