name: FillMeNow Google Play release

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: Release status
        required: true
        default: completed
        type: choice
        options:
          - draft
          - completed

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build release bundle
        working-directory: android-fueldrop
        run: gradle :app:bundleRelease --stacktrace

      - name: Restore private upload keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.FILLMENOW_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 -d > /tmp/fillmenow-upload.jks
          chmod 600 /tmp/fillmenow-upload.jks

      - name: Sign and verify AAB
        shell: bash
        env:
          KEY_PASSWORD: ${{ secrets.FILLMENOW_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED="$(find android-fueldrop/app/build/outputs/bundle/release -name '*.aab' | head -n1)"
          test -f "$UNSIGNED"
          cp "$UNSIGNED" /tmp/FillMeNow-release.aab
          jarsigner -keystore /tmp/fillmenow-upload.jks             -storepass "$KEY_PASSWORD"             -keypass "$KEY_PASSWORD"             -sigalg SHA256withRSA             -digestalg SHA-256             /tmp/FillMeNow-release.aab fillmenow-upload
          jarsigner -verify /tmp/FillMeNow-release.aab

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: au.com.fillmenow.app
          releaseFiles: /tmp/FillMeNow-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}

      - uses: actions/upload-artifact@v4
        with:
          name: FillMeNow-Google-Play-signed-AAB
          path: /tmp/FillMeNow-release.aab
          if-no-files-found: error
