name: FuelDrop production smoke test

on:
  push:
    paths:
      - .github/workflows/fueldrop-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const SITE='https://fueldrop-five.vercel.app';
          const API='https://psytztnkeeymavzmpomv.supabase.co/functions/v1/fueldrop';

          async function get(url, opts){
            const r=await fetch(url, opts);
            if(!r.ok) throw new Error(url+' -> '+r.status);
            return r;
          }

          const home=await (await get(SITE+'/')).text();
          if(!home.includes('const BACKEND="'+API+'";')) throw new Error('Backend URL missing');
          if(!home.includes('navigator.serviceWorker.register("/sw.js",{scope:"/"})')) throw new Error('Service worker root registration missing');
          if(!home.includes('/manifest.webmanifest')) throw new Error('Manifest link missing');
          const scripts=[...home.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          for(const script of scripts) new Function(script);

          const manifest=await (await get(SITE+'/manifest.webmanifest')).json();
          if(manifest.name!=='FuelDrop'||manifest.start_url!=='/'||manifest.scope!=='/') throw new Error('Manifest invalid');

          const sw=await (await get(SITE+'/sw.js')).text();
          if(!sw.includes("fueldrop-web-v57")||!sw.includes("clients.openWindow(HOME)")) throw new Error('Service worker invalid');

          const status=await (await get(API+'?api=status')).json();
          if(!status.ok||!Array.isArray(status.launchStates)||!status.launchStates.includes('NSW')||!status.launchStates.includes('WA')||!status.launchStates.includes('TAS')) throw new Error('Status endpoint invalid');

          const prices=await (await get(API+'?api=prices&state=NSW&fuel=Diesel&lat=-33.8688&lng=151.2093&radius=20')).json();
          if(!prices.ok||!Array.isArray(prices.rows)||prices.rows.length===0) throw new Error('Price endpoint returned no rows');

          const preflight=await fetch(API+'?api=subscribe',{
            method:'OPTIONS',
            headers:{Origin:SITE,'Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'content-type'}
          });
          if(!preflight.ok) throw new Error('CORS preflight failed '+preflight.status);
          if(preflight.headers.get('access-control-allow-origin')!=='*') throw new Error('CORS header missing');

          console.log(JSON.stringify({
            ok:true,
            site:SITE,
            launchStates:status.launchStates,
            pushConfigured:status.pushConfigured,
            nearbyRows:prices.rows.length,
            cors:preflight.headers.get('access-control-allow-origin')
          }));
          NODE
