name: FillMeNow Android build

on:
  push:
    branches: [main]
    paths:
      - 'android-fueldrop/**'
      - '.github/workflows/fueldrop-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build release app bundle
        working-directory: android-fueldrop
        run: gradle :app:bundleRelease --stacktrace

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: fillmenow-release-unsigned-aab
          path: android-fueldrop/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
