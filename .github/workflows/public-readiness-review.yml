name: FillMeNow public-readiness review
on:
  push:
    branches: [qa/public-readiness-20261007]
    paths:
      - 'tools/public-readiness-*.py'
      - 'tools/public-readiness-*.cjs'
      - '.github/workflows/public-readiness-review.yml'
permissions:
  contents: read
concurrency:
  group: fillmenow-public-readiness-review
  cancel-in-progress: true
jobs:
  web-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply guarded changes to the existing web app
        run: |
          if grep -q 'id="fillmenow-id-clarity-2026-10-06"' web/index.html; then
            python3 tools/public-readiness-repair.py
            python3 tools/public-readiness-followup.py
          fi
          python3 tools/public-readiness-final.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/index.html');s=p.read_text();key='/* FMN_FINAL_VISUAL_20261007 */'
          s=s.replace(key,key+'\nbody #page-more .reset-link{color:#526057!important}',1) if 'body #page-more .reset-link{color:#526057!important}' not in s else s
          p.write_text(s)
          PY
          git diff --check
      - name: Install pinned browser audit tools outside application source
        run: |
          mkdir -p /tmp/fmn-qa
          npm install --prefix /tmp/fmn-qa --ignore-scripts --no-audit --no-fund playwright@1.58.2 @axe-core/playwright@4.11.1
          /tmp/fmn-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Test seven viewport sizes, final screenshots and read-only fuel endpoints
        env:
          NODE_PATH: /tmp/fmn-qa/node_modules
        run: node tools/public-readiness-extra.cjs
      - name: Commit tested fixes to the review branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/qa/public-readiness-20261007
          git add web/index.html web/sw.js web/manifest.webmanifest
          if ! git diff --cached --quiet; then
            git -c user.name='FillMeNow QA' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Finish screenshot-verified public-readiness visual fixes'
            git -c credential.helper='!gh auth git-credential' push origin HEAD:refs/heads/qa/public-readiness-20261007
          fi
          git rev-parse HEAD > qa-results/review-commit.txt
      - name: Capture patch and reviewed web source
        if: always()
        run: |
          mkdir -p qa-results
          git diff -- web/index.html web/sw.js web/manifest.webmanifest > qa-results/uncommitted-review.patch
          cp -r web qa-results/reviewed-web
      - name: Upload screenshots, checks and reviewed source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fillmenow-public-readiness-review
          path: qa-results/
          retention-days: 7
          if-no-files-found: error
