name: FillMeNow branded individual map QA
on:
  push:
    branches: [ui/branded-individual-map-20261008]
    paths: ['tools/brand-map-*', '.github/workflows/brand-map-qa.yml']
permissions:
  contents: read
concurrency:
  group: fillmenow-brand-map-review
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Bundle verified artwork and change the existing map
        run: |
          python3 tools/brand-map-assets.py
          python3 tools/brand-map-apply.py
          git diff --check
      - name: Install pinned isolated browser tools
        run: |
          npm install --prefix /tmp/fmn-brand-qa --ignore-scripts --no-audit --no-fund playwright@1.58.2
          /tmp/fmn-brand-qa/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Test logos, all visible stations, real pointer selection and Dash
        env:
          NODE_PATH: /tmp/fmn-brand-qa/node_modules
        run: node tools/brand-map-test.cjs
      - name: Commit only verified web changes to the feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/ui/branded-individual-map-20261008
          remote_sha=$(git -c credential.helper='!gh auth git-credential' ls-remote origin "$GITHUB_REF" | cut -f1)
          test "$remote_sha" = "$GITHUB_SHA"
          git add web/index.html web/sw.js web/assets/brands
          if ! git diff --cached --quiet; then
            git -c user.name='FillMeNow QA' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Show verified retailer logos and individual selectable station pins'
            git -c credential.helper='!gh auth git-credential' push origin HEAD:"$GITHUB_REF"
          fi
          git rev-parse HEAD > qa-brand-map/review-commit.txt
      - name: Publish exact review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fillmenow-branded-map-evidence
          path: qa-brand-map/
          retention-days: 7
          if-no-files-found: error
