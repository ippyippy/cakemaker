name: FillMeNow follow clearance and preferences QA
on:
  push:
    branches: [fix/follow-clearance-preferences-20261009]
    paths: ['web/**', 'tools/follow-*', '.github/workflows/follow-preferences-qa.yml']
permissions:
  contents: read
concurrency:
  group: fillmenow-follow-preferences
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply scoped changes to the existing app
        run: |
          python3 tools/follow-preferences-apply.py
          node --check web/live-location.js
          node --check web/nearby-ui.js
          node --check web/nearby-core.js
          node --check web/journey.js
          git diff --check
      - name: Install isolated pinned browser tools
        run: |
          npm install --prefix /tmp/fmn-qa --ignore-scripts --no-audit --no-fund playwright@1.58.2
          /tmp/fmn-qa/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify new behaviour and preserve existing app functions
        env:
          NODE_PATH: /tmp/fmn-qa/node_modules
        run: |
          node tools/follow-preferences-test.cjs
          node tools/nearby-test.cjs
          node tools/saved-stations-test.cjs
          node tools/dash-position-test.cjs
          node tools/exact-map-test.cjs
          node tools/support-release-test.cjs
          node tools/backend-route-test.cjs
          git diff --check
      - name: Commit only passing application source to the reviewed branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/fix/follow-clearance-preferences-20261009
          git add web/index.html web/nearby-core.js web/nearby-ui.js web/journey.js web/privacy.html web/sw.js web/data/station-information.json
          if ! git diff --cached --quiet; then
            git -c user.name='FillMeNow QA' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Apply tested live following, persisted preferences and separate truck clearance filters'
            git -c credential.helper='!gh auth git-credential' push origin HEAD:refs/heads/fix/follow-clearance-preferences-20261009
          fi
          git rev-parse HEAD > qa-results/follow/review-commit.txt
      - name: Preserve public-source QA evidence without private profiles
        if: always()
        run: |
          mkdir -p qa-results/follow
          cp -r web qa-results/follow/reviewed-web
          cp tools/follow-preferences-* qa-results/follow/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fillmenow-follow-preferences-evidence
          path: qa-results/
          retention-days: 7
