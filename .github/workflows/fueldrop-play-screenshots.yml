name: FillMeNow Play screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fueldrop-play-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture Play Store phone screenshots
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          mkdir -p /tmp/fueldrop-shots /tmp/fd-shot-run
          cd /tmp/fd-shot-run
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 --no-save >/dev/null 2>&1
          CHROME="$CHROME" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          const SITE='https://fillmenow-au.vercel.app/';
          const out='/tmp/fueldrop-shots';

          async function settle(ms=1600){await new Promise(r=>setTimeout(r,ms))}
          (async()=>{
            const browser=await puppeteer.launch({
              executablePath:process.env.CHROME,
              headless:true,
              args:['--no-sandbox','--disable-setuid-sandbox']
            });
            const page=await browser.newPage();
            await page.setViewport({width:390,height:844,deviceScaleFactor:3});
            await page.goto(SITE,{waitUntil:'networkidle2',timeout:60000});
            await page.evaluate(()=>{
              localStorage.setItem('fdPrefs',JSON.stringify({
                state:'NSW',fuel:'Diesel',radius:20,tank:65,economy:9,
                vehicle:'car',frequency:'daily',time1:'06:00',time2:'15:30',threshold:''
              }));
              localStorage.setItem('fdLoc',JSON.stringify({
                lat:-33.8688,lng:151.2093,label:'Sydney NSW',suburb:'Sydney',postcode:'2000',state:'NSW'
              }));
              localStorage.removeItem('fdSaved');
            });
            await page.reload({waitUntil:'networkidle2',timeout:60000});
            await page.waitForSelector('#sheetMain',{timeout:30000});
            await settle(3000);

            await page.screenshot({path:out+'/01-explore.png',fullPage:false});

            await page.evaluate(()=>window.FD&&window.FD.options&&window.FD.options());
            await page.waitForSelector('#page-options.active',{timeout:10000});
            await settle(500);
            await page.screenshot({path:out+'/02-nearby-options.png',fullPage:false});

            await page.click('.nav[data-page="alerts"]');
            await page.waitForSelector('#page-alerts.active',{timeout:10000});
            await settle(400);
            await page.screenshot({path:out+'/03-price-alerts.png',fullPage:false});

            await page.click('.nav[data-page="saved"]');
            await page.waitForSelector('#page-saved.active',{timeout:10000});
            await settle(400);
            await page.screenshot({path:out+'/04-saved-dash.png',fullPage:false});

            await page.click('.nav[data-page="more"]');
            await page.waitForSelector('#page-more.active',{timeout:10000});
            await settle(400);
            await page.screenshot({path:out+'/05-more-dash.png',fullPage:false});

            for(const f of fs.readdirSync(out)){
              const s=fs.statSync(out+'/'+f);
              if(s.size<20000) throw new Error('Screenshot too small: '+f+' '+s.size);
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: fillmenow-play-phone-screenshots
          path: /tmp/fueldrop-shots/*.png
          if-no-files-found: error
