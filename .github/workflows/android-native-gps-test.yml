name: FillMeNow native GPS test APK
on:
  push:
    branches: [feature/android-native-location-20261010]
    paths: ['android/**', 'tools/android-native-smoke.py', '.github/workflows/android-native-gps-test.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fillmenow-native-gps-test
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up pinned Android build tools
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          curl --fail --location --silent --show-error https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o /tmp/gradle.zip
          EXPECTED="$(curl --fail --location --silent --show-error https://services.gradle.org/distributions/gradle-9.6.0-bin.zip.sha256)"
          echo "$EXPECTED  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
          echo /tmp/gradle-9.6.0/bin >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Compile APK and AAB and run Android lint
        run: gradle -p android --no-daemon :app:assembleRelease :app:bundleRelease :app:lintRelease --stacktrace
      - name: Prepare private-signing payload and emulator-only APK
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p native-package native-qa
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk native-package/FillMeNow-aligned-unsigned.apk
          cp android/app/build/outputs/bundle/release/app-release.aab native-package/FillMeNow-unsigned.aab
          cp "$BUILD_TOOLS/lib/apksigner.jar" native-package/apksigner.jar
          "$BUILD_TOOLS/aapt" dump badging native-package/FillMeNow-aligned-unsigned.apk > native-package/apk-badging.txt
          "$BUILD_TOOLS/aapt" dump permissions native-package/FillMeNow-aligned-unsigned.apk > native-package/apk-permissions.txt
          grep -q android.permission.ACCESS_FINE_LOCATION native-package/apk-permissions.txt
          grep -q android.permission.ACCESS_COARSE_LOCATION native-package/apk-permissions.txt
          ! grep -q android.permission.ACCESS_BACKGROUND_LOCATION native-package/apk-permissions.txt
          printf '%s\n' "$GITHUB_SHA" > native-package/source-commit.txt
          # Disposable emulator signature only: never trusted by the website or delivered.
          export CI_KEY_PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-only.jks" -storepass:env CI_KEY_PASS -keypass:env CI_KEY_PASS -alias emulator-only -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=FillMeNow disposable emulator test' -noprompt
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/ci-only.jks" --ks-key-alias emulator-only --ks-pass env:CI_KEY_PASS --key-pass env:CI_KEY_PASS --out "$RUNNER_TEMP/ci-test.apk" native-package/FillMeNow-aligned-unsigned.apk
          rm -f "$RUNNER_TEMP/ci-only.jks"
          "$BUILD_TOOLS/apksigner" verify "$RUNNER_TEMP/ci-test.apk"
          (cd native-package && sha256sum *.apk *.aab apksigner.jar > SHA256SUMS.txt)
      - name: Boot isolated Android emulator
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 libnss3 libxcomposite1 libxcursor1 libxi6 libxrandr2 libxkbfile1 libegl1 libgles2 libxcb-cursor0
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/fmn-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n fmn-gps -k 'system-images;android-35;google_apis;x86_64' -p "$ANDROID_AVD_HOME/fmn-gps.avd" --force
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$ANDROID_AVD_HOME/fmn-gps.avd" > "$ANDROID_AVD_HOME/fmn-gps.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -x fmn-gps
          "$ANDROID_HOME/emulator/emulator" -avd fmn-gps -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -memory 2048 > /tmp/fmn-emulator.log 2>&1 &
          EMULATOR_PID=$!
          trap 'tail -n 100 /tmp/fmn-emulator.log' ERR
          timeout 90 adb wait-for-device
          for i in $(seq 1 90); do
            kill -0 "$EMULATOR_PID" || { tail -n 100 /tmp/fmn-emulator.log; exit 1; }
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 && break
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install "$RUNNER_TEMP/ci-test.apk"
      - name: Test installed native release code
        timeout-minutes: 5
        run: python3 tools/android-native-smoke.py
      - name: Package private-signing handoff
        run: |
          cp android/NATIVE_GPS_TEST.md native-package/READ-ME-FIRST.md
          cp native-qa/report.json native-package/emulator-report.json
          echo 'UNSIGNED build payload. Final owner-key signature and live Digital Asset Links verification required before giving an APK to the owner. No Play publication.' > native-package/SIGNING-REQUIRED.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FillMeNow-native-GPS-private-signing-payload
          path: native-package/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve diagnostic evidence
        if: always()
        run: |
          mkdir -p native-qa
          cp android/app/build/reports/lint-results-release.* native-qa/ 2>/dev/null || true
          cp /tmp/fmn-emulator.log native-qa/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: FillMeNow-native-GPS-QA
          path: native-qa/
          retention-days: 7
      - name: Stop disposable emulator
        if: always()
        run: timeout 10 adb emu kill || true
