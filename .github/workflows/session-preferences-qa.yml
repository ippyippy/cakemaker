name: FillMeNow session preference regression QA
on:
  push:
    branches: [fix/session-preference-overwrite-20261009]
    paths: ['tools/session-preferences-*', '.github/workflows/session-preferences-qa.yml']
permissions:
  contents: read
concurrency:
  group: fillmenow-session-preferences
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply scoped preference-store correction
        run: |
          python3 tools/session-preferences-apply.py
          git diff --check
      - name: Install isolated browser test tools
        run: |
          npm install --prefix /tmp/fmn-qa --ignore-scripts --no-audit --no-fund playwright@1.58.2
          /tmp/fmn-qa/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify multi-session preferences and preserve existing features
        env:
          NODE_PATH: /tmp/fmn-qa/node_modules
        run: |
          node tools/session-preferences-test.cjs
          node tools/value-truck-test.cjs
          node tools/shared-search-test.cjs
          node tools/saved-stations-test.cjs
          node tools/dash-position-test.cjs
          node tools/exact-map-test.cjs
          node tools/support-release-test.cjs
          node tools/nearby-test.cjs
          node tools/backend-route-test.cjs
          git diff --check
      - name: Commit only passing source to the candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/fix/session-preference-overwrite-20261009
          git add web/index.html web/sw.js
          if ! git diff --cached --quiet; then
            git -c user.name='FillMeNow QA' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Prevent stale app sessions from restoring old vehicle preferences'
            git -c credential.helper='!gh auth git-credential' push origin HEAD:refs/heads/fix/session-preference-overwrite-20261009
          fi
          git rev-parse HEAD > qa-results/session-preferences/review-commit.txt
      - name: Preserve public-source test evidence
        if: always()
        run: |
          mkdir -p qa-results/session-preferences
          cp -r web qa-results/session-preferences/reviewed-web
          cp tools/session-preferences-* qa-results/session-preferences/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fillmenow-session-preferences-evidence
          path: qa-results/
          retention-days: 7
