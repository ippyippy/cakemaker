name: FillMeNow App Store release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26+
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -n 1)"
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        shell: bash
        run: |
          brew install xcodegen
          python3 -m pip install --break-system-packages pillow

      - name: Generate project and icon
        working-directory: ios-fillmenow
        run: |
          python3 scripts/generate_app_icon.py
          xcodegen generate

      - name: Install signing certificate and provisioning profile
        shell: bash
        env:
          CERT_P12_B64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CI_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERT_P12_B64"
          test -n "$CERT_PASSWORD"
          test -n "$PROFILE_B64"
          test -n "$KEYCHAIN_PASSWORD"

          echo "$CERT_P12_B64" | base64 -d > /tmp/distribution.p12
          echo "$PROFILE_B64" | base64 -d > /tmp/fillmenow.mobileprovision

          security create-keychain -p "$KEYCHAIN_PASSWORD" fillmenow-ci.keychain
          security set-keychain-settings -lut 21600 fillmenow-ci.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" fillmenow-ci.keychain
          security import /tmp/distribution.p12 -k fillmenow-ci.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s fillmenow-ci.keychain login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" fillmenow-ci.keychain

          security cms -D -i /tmp/fillmenow.mobileprovision > /tmp/profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/fillmenow.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive signed iPhone app
        working-directory: ios-fillmenow
        shell: bash
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild             -project FillMeNow.xcodeproj             -scheme FillMeNow             -configuration Release             -destination 'generic/platform=iOS'             -archivePath "$PWD/build/FillMeNow.xcarchive"             DEVELOPMENT_TEAM="$TEAM_ID"             CODE_SIGN_STYLE=Manual             PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"             archive

      - name: Export signed IPA
        working-directory: ios-fillmenow
        shell: bash
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>au.com.fillmenow.app</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive             -archivePath "$PWD/build/FillMeNow.xcarchive"             -exportPath "$PWD/build/AppStore"             -exportOptionsPlist /tmp/ExportOptions.plist

          test -f "$PWD/build/AppStore/FillMeNow.ipa"

      - name: Install App Store Connect API key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Upload build to App Store Connect
        working-directory: ios-fillmenow
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app             --type ios             --file "$PWD/build/AppStore/FillMeNow.ipa"             --apiKey "$ASC_KEY_ID"             --apiIssuer "$ASC_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: FillMeNow-App-Store-IPA
          path: ios-fillmenow/build/AppStore/FillMeNow.ipa
          if-no-files-found: error
